name: Build & Release Standalone Pack Studio

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows Executable
        run: |
          python build_exe.py

      - name: Create ZIP Archive of Release
        run: |
          Compress-Archive -Path "dist/Choicer Voicer Pack Studio/*" -DestinationPath "ChoicerVoicerPackStudio-Windows.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChoicerVoicerPackStudio-Windows
          path: ChoicerVoicerPackStudio-Windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1-mesa-glx libegl1-mesa libxkbcommon-x11-0

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux Binary
        run: |
          python build_exe.py

      - name: Create Tarball Archive
        run: |
          tar -czvf ChoicerVoicerPackStudio-Linux.tar.gz -C "dist/Choicer Voicer Pack Studio" .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChoicerVoicerPackStudio-Linux
          path: ChoicerVoicerPackStudio-Linux.tar.gz

  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: ChoicerVoicerPackStudio-Windows

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: ChoicerVoicerPackStudio-Linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ChoicerVoicerPackStudio-Windows.zip
            ChoicerVoicerPackStudio-Linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
